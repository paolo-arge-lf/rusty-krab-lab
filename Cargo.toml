# /Cargo.toml
# Rust community’s crate registry: https://crates.io/
[workspace]
resolver = "3"
members = [
    "rusty-crates/*",
]

# Enforce unified dependency versions across the workspace
[workspace.dependencies]
# Command-line parser
clap = { version = "4.6", features = ["derive"] }
# Terminal colors
owo-colors = "4.4" 
# Macros and traits for working with enums 
strum = { version = "0.28", features = ["derive"] }
# Date-time library
jiff = { version = "0.1", features = ["serde"] }
# For pretty print tables
tabled = { version = "0.22" }
# Serializing and deserializing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"